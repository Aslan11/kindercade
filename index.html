<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Kindercade — Learning Games</title>

<!-- iPad: fill the screen, never zoom, respect the notch/home indicator. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="description" content="A little arcade of beautiful learning games for young children: counting, adding, spelling and puzzles." />
<meta name="theme-color" content="#55b9f7" />
<meta name="color-scheme" content="light" />

<!-- Add-to-home-screen: launches full screen with no Safari chrome. -->
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Kindercade" />
<meta name="format-detection" content="telephone=no" />

<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="assets/icon-192.png" sizes="192x192" />
<link rel="apple-touch-icon" href="assets/icon-180.png" />
<link rel="stylesheet" href="styles/main.css" />
<link rel="modulepreload" href="vendor/three/three.module.min.js" />
</head>
<body>

<!-- Everything you can see in 3D — the island and every game — is drawn here. -->
<canvas id="game-canvas"></canvas>

<!-- ─────────────────────────────  HOME  ───────────────────────────── -->
<div id="home" class="layer">
  <header class="topbar">
    <h1 aria-label="Kindercade"></h1>
    <div class="topbar-actions" id="actions"></div>
  </header>
  <main id="cards"></main>
  <p id="install-hint"></p>
</div>

<!-- ─────────────────────────────  GAME  ───────────────────────────── -->
<div id="hud" class="layer"></div>

<div id="rotate-hint" class="rotate-hint">
  <div class="rotate-card">
    <span class="rotate-ico" aria-hidden="true"></span>
    <strong>Turn your screen sideways</strong>
    <span>These games are best in landscape.</span>
  </div>
</div>

<!-- ────────────────────────────  DIALOGS  ─────────────────────────── -->
<div id="overlay" class="overlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true">
    <span id="sheet-close"></span>
    <div id="sheet-body"></div>
  </div>
</div>

<div id="wipe" class="wipe shut" aria-hidden="true"></div>

<!-- A fresh page can arrive with last version's scripts still in the offline
     cache. Reload once, as soon as the new service worker has taken over. -->
<script>
  if (navigator.serviceWorker && navigator.serviceWorker.controller) {
    navigator.serviceWorker.addEventListener('controllerchange', () => location.reload(), { once: true });
    navigator.serviceWorker.getRegistration().then((r) => r && r.update()).catch(() => {});
  }
</script>
<script type="module" src="src/app.js"></script>
</body>
</html>
